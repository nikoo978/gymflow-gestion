name: CI

on:
  push:
    branches:
      - main
      - v1.07-portable-docker-hosting
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit package lock
        if: github.event_name == 'push' && steps.lock.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "V1.07: actualiza lockfile para runtime mínimo"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install
        run: npm ci

      - name: Portability audit
        run: npm run audit:portability

      - name: Vite build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Docker build
        run: docker build -t gymflow-ci .

      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gymflow-ci -p 3000:3000 gymflow-ci
          trap 'docker logs gymflow-ci || true; docker rm -f gymflow-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "GymFlow container did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q "Infytter Fitness"
          curl --fail --silent --show-error http://127.0.0.1:3000/pantalla-acceso | grep -q "Infytter Fitness"
